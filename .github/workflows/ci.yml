name: CI Browser Gate & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nexushunter
          POSTGRES_PASSWORD: huntersecret123
          POSTGRES_DB: nexushunter_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://nexushunter:huntersecret123@localhost:5432/nexushunter_db?sslmode=disable
        run: bash ./scripts/migrate.sh || true

      - name: Typecheck and Lint
        run: npm run lint

      - name: Contract Invariants Suite
        run: npm run test:contract

      - name: Integration Suite
        env:
          DATABASE_URL: postgres://nexushunter:huntersecret123@localhost:5432/nexushunter_db?sslmode=disable
        run: npm run test:integration

      - name: API E2E Suite
        env:
          DATABASE_URL: postgres://nexushunter:huntersecret123@localhost:5432/nexushunter_db?sslmode=disable
        run: npm run test:api-e2e

      - name: Real Browser E2E Suite
        env:
          DATABASE_URL: postgres://nexushunter:huntersecret123@localhost:5432/nexushunter_db?sslmode=disable
          CI: 'true'
        run: npm run test:browser-e2e

      - name: Frontend Production Build
        run: npm run build

      - name: Upload Test Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
